[www]
listen = 127.0.0.1:9000
listen.allowed_clients = 127.0.0.1
user = www-data
group = www-data
clear_env = no

; With memory_limit=128M, 3 children max ≈ 384MB worst case,
; leaving headroom for nginx/supervisor/system on a 512MB box.
pm = dynamic
pm.max_children = 3
pm.start_servers = 1
pm.min_spare_servers = 1
pm.max_spare_servers = 2
pm.max_requests = 200
request_terminate_timeout = 60
