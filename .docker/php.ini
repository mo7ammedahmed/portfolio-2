; Tuned for Render Free Plan (512MB RAM, shared CPU)
upload_max_filesize = 12M
post_max_size = 14M
memory_limit = 128M
max_execution_time = 60
max_input_time = 60

; Opcache - reduces CPU/parse overhead, safe memory footprint
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 64
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
opcache.save_comments = 1
opcache.jit = off

; Keep error noise out of the response body in production
display_errors = Off
log_errors = On
